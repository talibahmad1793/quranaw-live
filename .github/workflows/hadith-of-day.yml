name: Hadith of the Day (push notification)

on:
  schedule:
    # 01:00 UTC = 6:30 AM IST. GitHub can start scheduled runs a few
    # minutes late at busy times.
    - cron: "0 1 * * *"
  workflow_dispatch: {} # "Run workflow" button in the Actions tab, for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web-push
        run: npm install --no-save web-push@3

      - name: Send today's hadith
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-hadith-of-day.js
